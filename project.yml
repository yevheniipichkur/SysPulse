name: SysPulse
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  SysPulse:
    type: application
    platform: iOS
    sources:
      - path: SysPulse
        excludes:
          - Resources/**
          - Info.plist
          - SysPulse.entitlements
    resources:
      - path: SysPulse/Resources/Assets.xcassets
      - path: SysPulse/Resources/PrivacyInfo.xcprivacy
      - path: SysPulse/Resources/en.lproj
      - path: SysPulse/Resources/pl.lproj
      - path: SysPulse/Resources/ru.lproj
      - path: SysPulse/Resources/uk.lproj
    entitlements:
      path: SysPulse/SysPulse.entitlements
    info:
      path: SysPulse/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleIconName: AppIcon
        CFBundleDisplayName: SysPulse
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: SysPulse uses Face ID to protect saved server profiles and credentials.
        NSLocalNetworkUsageDescription: SysPulse can connect to Linux servers on your local network when you add them.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse
        PRODUCT_NAME: SysPulse
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse
    dependencies:
      - target: SysPulseWidgets
        embed: true
  SysPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SysPulseWidgets
        excludes:
          - Resources/**
          - Info.plist
          - SysPulseWidgets.entitlements
    resources:
      - path: SysPulseWidgets/Resources
    entitlements:
      path: SysPulseWidgets/SysPulseWidgets.entitlements
    info:
      path: SysPulseWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.widgets
        PRODUCT_NAME: SysPulseWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse.widgets
  SysPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SysPulseTests
        excludes:
          - Info.plist
    info:
      path: SysPulseTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.tests
    dependencies:
      - target: SysPulse
schemes:
  SysPulse:
    build:
      targets:
        SysPulse: all
        SysPulseWidgets: all
        SysPulseTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SysPulseTests
    run:
      config: Debug
    archive:
      config: Release
