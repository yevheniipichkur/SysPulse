name: SysPulse
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: "0.12.1"
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: "0.3.6"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: "1.13.0"
targets:
  SysPulse:
    type: application
    platform: iOS
    sources:
      - path: SysPulse
        excludes:
          - Resources/**
          - Info.plist
          - SysPulse.entitlements
          - SysPulse-Bridging-Header.h
      - path: SysPulse/Resources
        buildPhase: resources
      - path: Shared
    entitlements:
      path: SysPulse/SysPulse.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yevheniipichkur.syspulse
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yevheniipichkur.syspulse
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: SysPulse/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: SysPulse
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: SysPulse uses Face ID to protect saved server profiles and credentials.
        NSLocalNetworkUsageDescription: SysPulse can connect to Linux servers on your local network when you add them.
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.yevheniipichkur.syspulse.scheduled-commands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse
        PRODUCT_NAME: SysPulse
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/SysPulse/SysPulse-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: SysPulse
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse
    dependencies:
      - target: SysPulseWidgets
        embed: true
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: SwiftTerm
  SysPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SysPulseWidgets
        excludes:
          - Resources/**
          - Info.plist
          - SysPulseWidgets.entitlements
      - path: Shared
    resources:
      - path: SysPulseWidgets/Resources
    entitlements:
      path: SysPulseWidgets/SysPulseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yevheniipichkur.syspulse
    info:
      path: SysPulseWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: SysPulse
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.widgets
        PRODUCT_NAME: SysPulseWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse.widgets
  SysPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SysPulseTests
        excludes:
          - Info.plist
    info:
      path: SysPulseTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.tests
        SKIP_INSTALL: YES
    dependencies:
      - target: SysPulse
  SysPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SysPulseUITests
        excludes:
          - Info.plist
    info:
      path: SysPulseUITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.uitests
        SKIP_INSTALL: YES
        TEST_TARGET_NAME: SysPulse
    dependencies:
      - target: SysPulse
schemes:
  SysPulse:
    build:
      targets:
        SysPulse: all
        SysPulseTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SysPulseTests
    run:
      config: Debug
    archive:
      config: Release
  SysPulseScreenshots:
    build:
      targets:
        SysPulse: all
        SysPulseUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - SysPulseUITests
    run:
      config: Debug
