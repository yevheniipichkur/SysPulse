name: SysPulse
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: "0.12.1"
targets:
  SysPulse:
    type: application
    platform: iOS
    sources:
      - path: SysPulse
        excludes:
          - Resources/**
          - Info.plist
          - SysPulse.entitlements
      - path: SysPulse/Resources
        buildPhase: resources
      - path: Shared
    entitlements:
      path: SysPulse/SysPulse.entitlements
    info:
      path: SysPulse/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse
        PRODUCT_NAME: SysPulse
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: SysPulse
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse
    dependencies:
      - target: SysPulseWidgets
        embed: true
      - package: Citadel
  SysPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SysPulseWidgets
        excludes:
          - Resources/**
          - Info.plist
          - SysPulseWidgets.entitlements
      - path: Shared
    resources:
      - path: SysPulseWidgets/Resources
    entitlements:
      path: SysPulseWidgets/SysPulseWidgets.entitlements
    info:
      path: SysPulseWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: SysPulse
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.widgets
        PRODUCT_NAME: SysPulseWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: com.yevheniipichkur.syspulse.widgets
  SysPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SysPulseTests
        excludes:
          - Info.plist
    info:
      path: SysPulseTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yevheniipichkur.syspulse.tests
        SKIP_INSTALL: YES
    dependencies:
      - target: SysPulse
schemes:
  SysPulse:
    build:
      targets:
        SysPulse: all
        SysPulseTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SysPulseTests
    run:
      config: Debug
    archive:
      config: Release
