name: iOS Screenshots

on:
  workflow_dispatch:

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: SysPulse.xcodeproj
  SCREENSHOT_SCHEME: SysPulseScreenshots
  APP_BUNDLE_ID: com.yevheniipichkur.syspulse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  screenshots:
    name: Capture App Store screenshots
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.4.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.3.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Selected: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create screenshot simulator
        run: |
          set -euo pipefail
          SIM_INFO_FILE=$(mktemp)
          python3 <<'PY' > "$SIM_INFO_FILE"
          import json
          import re
          import subprocess
          import sys

          devtypes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]

          preferred_devices = [
              "iPhone 13 Pro Max",
              "iPhone 12 Pro Max",
              "iPhone 15 Pro Max",
              "iPhone 14 Pro Max",
              "iPhone 16 Pro Max",
          ]
          device = next((item for name in preferred_devices for item in devtypes if item.get("name") == name), None)
          if device is None:
              device = next((item for item in devtypes if "iPhone" in item.get("name", "") and "Pro Max" in item.get("name", "")), None)
          if device is None:
              device = next((item for item in devtypes if "iPhone" in item.get("name", "")), None)
          if device is None:
              sys.exit("No available iPhone device type found.")

          ios_runtimes = [
              item for item in runtimes
              if item.get("isAvailable", False)
              and (
                  item.get("platform") == "iOS"
                  or item.get("name", "").startswith("iOS")
                  or "SimRuntime.iOS" in item.get("identifier", "")
              )
          ]
          if not ios_runtimes:
              sys.exit("No available iOS runtime found.")

          def version_key(item):
              return tuple(int(part) for part in re.findall(r"\d+", item.get("version", "")))

          runtime = sorted(ios_runtimes, key=version_key)[-1]
          print(device["identifier"])
          print(runtime["identifier"])
          print(device["name"])
          print(runtime["name"])
          PY

          DEVICE_TYPE_ID=$(sed -n '1p' "$SIM_INFO_FILE")
          RUNTIME_ID=$(sed -n '2p' "$SIM_INFO_FILE")
          DEVICE_NAME=$(sed -n '3p' "$SIM_INFO_FILE")
          RUNTIME_NAME=$(sed -n '4p' "$SIM_INFO_FILE")
          rm -f "$SIM_INFO_FILE"

          SIMULATOR_ID=$(xcrun simctl create "SysPulse Screenshots" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "SIMULATOR_DESTINATION=id=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using $DEVICE_NAME on $RUNTIME_NAME (id=$SIMULATOR_ID)"

      - name: Capture screenshots
        run: |
          set +e
          set -o pipefail
          mkdir -p build/screenshots build/logs build/SourcePackages
          rm -rf build/logs/SysPulseScreenshots.xcresult
          xcrun simctl boot "${SIMULATOR_DESTINATION#id=}" || true
          xcrun simctl bootstatus "${SIMULATOR_DESTINATION#id=}" -b
          xcrun simctl ui "${SIMULATOR_DESTINATION#id=}" appearance dark || true
          xcrun simctl status_bar "${SIMULATOR_DESTINATION#id=}" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 || true
          SYSPULSE_SCREENSHOT_DIR="$PWD/build/screenshots" xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCREENSHOT_SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/logs/SysPulseScreenshots.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee build/logs/screenshots.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Screenshot failure excerpt"
            grep -E "error:|XCTAssert|failed|Failure|Timed out|waitFor|Unable to|Exception|Test Case|Issue recorded" build/logs/screenshots.log | tail -n 220 || true
            echo "::endgroup::"
          fi

          launch_screen_was_patched=0
          ensure_launch_screen() {
            app_path=$(find build/DerivedData/Build/Products -path "*/Debug-iphonesimulator/*.app" -name "SysPulse.app" | head -n 1 || true)
            if [ -z "$app_path" ]; then
              echo "::error::Could not find built SysPulse.app to validate launch screen metadata."
              return 1
            fi

            launch_storyboard=$(/usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$app_path/Info.plist" 2>/dev/null || true)
            echo "UILaunchStoryboardName: ${launch_storyboard:-not found}"
            if [ "$launch_storyboard" != "LaunchScreen" ]; then
              echo "::warning::Expected UILaunchStoryboardName=LaunchScreen. Patching built app before direct simulator capture."
              /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$app_path/Info.plist" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$app_path/Info.plist"
              launch_screen_was_patched=1
            fi
            if ! find "$app_path" -name "LaunchScreen.storyboardc" -type d | grep -q .; then
              echo "::error::LaunchScreen.storyboardc was not found in the built app bundle."
              return 1
            fi
          }

          launch_screen_status=0
          ensure_launch_screen || launch_screen_status=$?

          capture_simulator_screenshot() {
            tab="$1"
            name="$2"
            simulator_id="${SIMULATOR_DESTINATION#id=}"

            xcrun simctl terminate "$simulator_id" "$APP_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$simulator_id" "$APP_BUNDLE_ID" \
              -sysPulseScreenshotMode \
              -sysPulseScreenshotTab "$tab" \
              UITEST_SCREENSHOTS \
              DISABLE_ANIMATIONS \
              -AppleLanguages "(en)" \
              -AppleLocale "en_US" >/dev/null || return 1
            sleep 6
            xcrun simctl io "$simulator_id" screenshot "build/screenshots/$name.png" >/dev/null || return 1
          }

          capture_all_simulator_screenshots() {
            app_path=$(find build/DerivedData/Build/Products -path "*/Debug-iphonesimulator/*.app" -name "SysPulse.app" | head -n 1 || true)
            if [ -n "$app_path" ]; then
              xcrun simctl install "${SIMULATOR_DESTINATION#id=}" "$app_path" || true
            fi

            rm -f build/screenshots/*.png
            capture_simulator_screenshot servers 01-servers || return 1
            capture_simulator_screenshot monitor 02-monitor || return 1
            capture_simulator_screenshot terminal 03-terminal || return 1
            capture_simulator_screenshot sftp 04-files || return 1
            capture_simulator_screenshot settings 05-settings || return 1
          }

          normalize_app_store_screenshots() {
            target_width=1284
            target_height=2778

            for screenshot in build/screenshots/*.png; do
              [ -f "$screenshot" ] || continue

              width=$(sips -g pixelWidth "$screenshot" 2>/dev/null | awk '/pixelWidth/ {print $2; exit}')
              height=$(sips -g pixelHeight "$screenshot" 2>/dev/null | awk '/pixelHeight/ {print $2; exit}')
              echo "$(basename "$screenshot"): ${width:-?}x${height:-?}"
              if [ -z "$width" ] || [ -z "$height" ]; then
                echo "::error::Could not read PNG dimensions for $screenshot."
                return 1
              fi

              if [ "$width" = "$target_width" ] && [ "$height" = "$target_height" ]; then
                continue
              fi

              if awk "BEGIN { exit !($width * $target_height < $target_width * $height) }"; then
                sips --resampleWidth "$target_width" "$screenshot" >/dev/null
              else
                sips --resampleHeight "$target_height" "$screenshot" >/dev/null
              fi
              sips --cropToHeightWidth "$target_height" "$target_width" "$screenshot" >/dev/null

              width=$(sips -g pixelWidth "$screenshot" 2>/dev/null | awk '/pixelWidth/ {print $2; exit}')
              height=$(sips -g pixelHeight "$screenshot" 2>/dev/null | awk '/pixelHeight/ {print $2; exit}')
              if [ "$width" != "$target_width" ] || [ "$height" != "$target_height" ]; then
                echo "::error::$(basename "$screenshot") has ${width:-?}x${height:-?}; expected ${target_width}x${target_height}."
                return 1
              fi
            done
          }

          png_count=$(find build/screenshots -name "*.png" -type f | wc -l | tr -d " ")
          if [ "$png_count" -lt 5 ] || [ "$launch_screen_was_patched" -ne 0 ]; then
            if [ "$launch_screen_was_patched" -ne 0 ] && [ "$png_count" -ge 5 ]; then
              echo "::warning::UI test screenshots were captured before launch screen patching. Recapturing directly from the simulator."
            fi
            echo "::warning::UI test wrote $png_count PNG files. Capturing App Store screenshots directly from the simulator."
            if ! capture_all_simulator_screenshots; then
              echo "::warning::Direct simulator capture failed. Capturing one fallback screenshot."
              xcrun simctl io "${SIMULATOR_DESTINATION#id=}" screenshot build/screenshots/00-fallback-simulator.png || true
            fi
          fi

          normalize_status=0
          normalize_app_store_screenshots || normalize_status=$?

          echo "::group::Screenshot output files"
          find build/screenshots build/logs -maxdepth 2 -type f -print || true
          echo "::endgroup::"

          png_count=$(find build/screenshots -name "*.png" -type f | wc -l | tr -d " ")
          if [ "$normalize_status" -ne 0 ]; then
            status=65
          elif [ "$launch_screen_status" -ne 0 ]; then
            echo "::error::Launch screen validation failed; refusing to upload potentially letterboxed screenshots."
            status=65
          elif [ "$png_count" -lt 5 ]; then
            echo "::error::Expected 5 App Store screenshots, found $png_count."
            status=65
          elif [ "$status" -ne 0 ]; then
            echo "::warning::xcodebuild test returned $status, but all 5 screenshots were captured."
            status=0
          fi
          exit "$status"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syspulse-app-store-screenshots
          path: |
            build/screenshots/**
            build/logs/screenshots.log
            build/logs/SysPulseScreenshots.xcresult
          if-no-files-found: warn

      - name: Delete screenshot simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_ID" >/dev/null 2>&1 || true
            xcrun simctl delete "$SIMULATOR_ID" >/dev/null 2>&1 || true
          fi
