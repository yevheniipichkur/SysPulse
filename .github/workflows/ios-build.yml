name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run XCTest suite before packaging
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: SysPulse
  PROJECT: SysPulse.xcodeproj
  DEFAULT_BUNDLE_ID: com.yevheniipichkur.syspulse
  ARCHIVE_PATH: build/SysPulse.xcarchive
  EXPORT_PATH: build/export
  MARKETING_VERSION: 0.1.0
  BUILD_NUMBER: ${{ github.run_number }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
  APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
  APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64 }}
  APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
  APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
  APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
  RUN_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == true }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SysPulse
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "=== Available Xcode installations ==="
          ls -la /Applications | grep -i xcode || echo "(none found)"
          echo ""
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.4.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.3.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Selected: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo ""
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Stamp bundle versions
        run: |
          set -euo pipefail
          echo "Stamping Info.plist files with marketing version $MARKETING_VERSION and build $BUILD_NUMBER."

          set_plist_string() {
            local plist="$1"
            local key="$2"
            local value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          for plist in SysPulse/Info.plist SysPulseWidgets/Info.plist SysPulseTests/Info.plist; do
            set_plist_string "$plist" CFBundleShortVersionString "$MARKETING_VERSION"
            set_plist_string "$plist" CFBundleVersion "$BUILD_NUMBER"
            echo "$plist:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist"
          done

          # xcodebuild -exportArchive re-runs Info.plist processing from the xcodeproj
          # build settings, which overwrites any archive-level patches. Stamp the xcodeproj
          # directly so both the archive and the export use the right version numbers.
          PBXPROJ="$PROJECT/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" "$PBXPROJ"
          echo "xcodeproj build settings stamped:"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ" | head -n 4
          grep "MARKETING_VERSION" "$PBXPROJ" | head -n 4

      - name: Prepare build directories
        run: mkdir -p build/logs build/SourcePackages

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve simulator destination
        run: |
          SIMULATOR_DESTINATION=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print "id="$2; exit}')
          if [ -z "$SIMULATOR_DESTINATION" ]; then
            echo "No available iPhone simulator found. Debug build will use generic iOS destination."
            echo "SIMULATOR_DESTINATION=generic/platform=iOS" >> "$GITHUB_ENV"
          else
            echo "Using simulator destination: $SIMULATOR_DESTINATION"
            echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"
          fi

      - name: Explain signing state
        run: |
          echo "Marketing version: $MARKETING_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "Run tests: $RUN_TESTS"
          echo "Unsigned compile check runs when signing secrets are missing or manual tests are requested."
          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "IPA export is skipped until signing secrets are configured."
            echo "Required for IPA: APPLE_TEAM_ID, APPLE_BUNDLE_ID, APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64."
          fi
          if [ -z "${APPSTORE_CONNECT_API_KEY_ID:-}" ] || [ -z "${APPSTORE_CONNECT_API_ISSUER_ID:-}" ] || [ -z "${APPSTORE_CONNECT_API_KEY_BASE64:-}" ]; then
            echo "TestFlight upload is skipped until App Store Connect API secrets are configured."
          fi

      - name: Build unsigned debug
        if: ${{ env.APPLE_TEAM_ID == '' || env.APPLE_CERTIFICATE_BASE64 == '' || env.RUN_TESTS == 'true' }}
        run: |
          set -o pipefail
          mkdir -p build/logs
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee build/logs/build-debug.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Build failed. Extracting compiler diagnostics:"
            grep -E "error:|warning:" build/logs/build-debug.log | tail -n 80 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$BUILD_STATUS"

      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' }}
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "$SIMULATOR_DESTINATION" = "generic/platform=iOS" ]; then
            echo "No available iPhone simulator found. Skipping tests after successful compile check."
            exit 0
          fi
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            | tee build/logs/test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "Tests failed. Extracting XCTest diagnostics as warnings so TestFlight packaging can continue:"
            { grep -E "error:|warning:|failed:|Test Case|Executed|Testing failed" build/logs/test.log || true; } | tail -n 120 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::warning::$escaped"
            done
          fi
          exit 0

      - name: Create unsigned archive
        if: ${{ env.APPLE_TEAM_ID == '' || env.APPLE_CERTIFICATE_BASE64 == '' }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/logs/archive-unsigned.log

      - name: Require iOS 26 SDK for distribution
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          XCODE_INFO=$(xcodebuild -version 2>/dev/null || true)
          ACTIVE_XCODE=$(printf '%s\n' "$XCODE_INFO" | head -1)
          echo "Active Xcode: $ACTIVE_XCODE"
          SDKS=$(xcodebuild -showsdks 2>/dev/null || true)
          echo "=== Available SDKs ==="
          printf '%s\n' "$SDKS"
          echo ""
          if printf '%s\n' "$SDKS" | grep -qE "iphoneos26|iOS 26"; then
            echo "iOS 26 SDK: found — proceeding with distribution archive."
          else
            CURRENT_SDK=$(printf '%s\n' "$SDKS" | grep iphoneos | tail -1 || echo "unknown")
            echo "::error::iOS 26 SDK not found."
            echo "::error::Active Xcode: $ACTIVE_XCODE"
            echo "::error::Highest available iOS SDK: $CURRENT_SDK"
            echo "::error::App Store Connect requires ALL iOS apps to be built with the iOS 26 SDK or later."
            echo "::error::The signed archive and TestFlight upload are blocked until the runner has Xcode 26."
            echo "::error::Solution: change 'runs-on' to a macOS image that ships with Xcode 26."
            exit 1
          fi

      - name: Prepare signing assets
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p private_keys
          decode_secret() {
            local output_path="$1"
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["SECRET_BASE64"]))' > "$output_path"
          }
          SECRET_BASE64="$APPLE_CERTIFICATE_BASE64" decode_secret certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 decoded to an empty file. Recreate the .p12 base64 secret."
            exit 1
          fi
          echo "Decoded certificate.p12 ($(wc -c < certificate.p12) bytes)."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "SIGNING_KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db" >> "$GITHUB_ENV"
          set +e
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > build/logs/security-import.log 2>&1
          IMPORT_STATUS=$?
          set -e
          if [ "$IMPORT_STATUS" -ne 0 ]; then
            echo "::error::Could not import APPLE_CERTIFICATE_BASE64 into keychain. Check that the .p12 includes a private key and APPLE_CERTIFICATE_PASSWORD is correct."
            sed -E 's/[A-Za-z0-9+\/=]{24,}/[redacted]/g' build/logs/security-import.log | tail -n 40 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
            exit "$IMPORT_STATUS"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          install_profile() {
            local secret_b64="$1"
            local tmp_file="$2"
            SECRET_BASE64="$secret_b64" decode_secret "$tmp_file"
            if [ ! -s "$tmp_file" ]; then
              echo "::error::Profile secret decoded to an empty file."
              exit 1
            fi
            security cms -D -i "$tmp_file" > "${tmp_file}.plist"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "${tmp_file}.plist")
            local name
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "${tmp_file}.plist")
            cp "$tmp_file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$tmp_file" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "Installed profile: $name ($uuid)"
          }
          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            install_profile "$APPLE_PROVISIONING_PROFILE_BASE64" profile.mobileprovision
          else
            echo "No provisioning profile secret supplied. xcodebuild will rely on automatic signing."
          fi
          if [ -n "${APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64:-}" ]; then
            install_profile "$APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64" profile-widgets.mobileprovision
          fi
          if [ -n "${APPSTORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APPSTORE_CONNECT_API_KEY_BASE64:-}" ]; then
            SECRET_BASE64="$APPSTORE_CONNECT_API_KEY_BASE64" decode_secret "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
            if [ ! -s "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" ]; then
              echo "::error::APPSTORE_CONNECT_API_KEY_BASE64 decoded to an empty file. Recreate the .p8 base64 secret."
              exit 1
            fi
            echo "ASC_KEY_PATH=$PWD/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          fi

      - name: Create signed archive
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          set +e
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            | tee build/logs/archive-signed.log
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo "Signed archive failed. Extracting signing diagnostics:"
            grep -E "error:|warning:|Provisioning|provisioning|No profiles|requires a provisioning profile|errSec|Command CodeSign failed|CodeSign error|No signing certificate|Signing for|requires a development team" build/logs/archive-signed.log | tail -n 160 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$ARCHIVE_STATUS"

      - name: Validate signed archive shape
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          ARCHIVE_PLIST="$ARCHIVE_PATH/Info.plist"
          echo "Archive application properties:"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties" "$ARCHIVE_PLIST"
          APP_PATH=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:ApplicationPath" "$ARCHIVE_PLIST")
          APP_PRODUCT_PATH="$ARCHIVE_PATH/Products/$APP_PATH"
          if [ ! -d "$APP_PRODUCT_PATH" ] && [ -n "$APP_PATH" ]; then
            APP_PRODUCT_PATH="$ARCHIVE_PATH/Products/Applications/$APP_PATH"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PRODUCT_PATH" ]; then
            echo "::error::Signed archive is not an exportable iOS app archive. Check SKIP_INSTALL settings for non-app targets."
            find "$ARCHIVE_PATH/Products" -maxdepth 4 -print || true
            exit 1
          fi

      - name: Patch archive bundle versions
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "Patching CFBundleVersion to build number $BUILD_NUMBER in archived app bundles."

          set_plist_string() {
            local plist="$1"
            local key="$2"
            local value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          PATCHED=0
          while IFS= read -r -d '' plist; do
            case "$plist" in
              *.app/Info.plist|*.appex/Info.plist)
                set_plist_string "$plist" CFBundleVersion "$BUILD_NUMBER"
                set_plist_string "$plist" CFBundleShortVersionString "$MARKETING_VERSION"
                BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || echo "unknown")
                BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
                echo "$BUNDLE_ID CFBundleVersion=$BUNDLE_VERSION ($plist)"
                if [ "$BUNDLE_VERSION" != "$BUILD_NUMBER" ]; then
                  echo "::error::$plist has CFBundleVersion=$BUNDLE_VERSION, expected $BUILD_NUMBER."
                  exit 1
                fi
                PATCHED=$((PATCHED + 1))
                ;;
            esac
          done < <(find "$ARCHIVE_PATH/Products/Applications" -name Info.plist -print0)

          if [ "$PATCHED" -eq 0 ]; then
            echo "::error::No app or app extension Info.plist files were patched in the archive."
            exit 1
          fi

          ARCHIVE_INFO="$ARCHIVE_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD_NUMBER" "$ARCHIVE_INFO" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:CFBundleVersion string $BUILD_NUMBER" "$ARCHIVE_INFO" 2>/dev/null \
            || true
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleShortVersionString $MARKETING_VERSION" "$ARCHIVE_INFO" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:CFBundleShortVersionString string $MARKETING_VERSION" "$ARCHIVE_INFO" 2>/dev/null \
            || true

      - name: Ensure app icon plist metadata
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          APP_DIR=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          APP_PLIST="$APP_DIR/Info.plist"
          echo "Patching icon metadata in $APP_PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$APP_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$APP_PLIST"

          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName AppIcon" "$APP_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_PLIST"

          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP_PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" "$APP_PLIST"
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP_PLIST"

          # UILaunchScreen must be present or iOS shows black bars (letterboxing)
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:UIColorName string LaunchBackground" "$APP_PLIST" 2>/dev/null || true
          echo "UILaunchScreen: $(/usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PLIST" 2>/dev/null || echo 'not found')"

      - name: Export IPA
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          BUNDLE_ID="${APPLE_BUNDLE_ID:-$DEFAULT_BUNDLE_ID}"
          write_export_options() {
            local export_method="$1"
            cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$export_method</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$BUNDLE_ID</string>
              <key>$BUNDLE_ID.widgets</key>
              <string>$BUNDLE_ID.widgets</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          }

          run_export() {
            local export_method="$1"
            rm -rf "$EXPORT_PATH"
            mkdir -p "$EXPORT_PATH"
            write_export_options "$export_method"
            echo "Exporting IPA with method=$export_method"
            set +e
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist ExportOptions.plist \
              2>&1 | tee "build/logs/export-ipa-$export_method.log"
            local export_status=${PIPESTATUS[0]}
            set -e
            cp "build/logs/export-ipa-$export_method.log" build/logs/export-ipa.log
            return "$export_status"
          }

          set +e
          run_export "app-store-connect"
          EXPORT_STATUS=$?
          if [ "$EXPORT_STATUS" -ne 0 ] && grep -qE 'exportOptionsPlist error for key "method"|expected one' build/logs/export-ipa.log; then
            echo "app-store-connect export method was rejected by this Xcode/archive. Retrying with legacy app-store method."
            run_export "app-store"
            EXPORT_STATUS=$?
          fi
          set -e
          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "IPA export failed. Extracting export diagnostics:"
            {
              grep -E "error:|warning:|Provisioning|provisioning|Signing|signing|No profiles|requires a provisioning profile|exportArchive|method|teamID|ipatool|Export failed|IDEDistribution" build/logs/export-ipa.log || true
              echo "--- tail export-ipa.log ---"
              tail -n 180 build/logs/export-ipa.log || true
            } | tail -n 220 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$EXPORT_STATUS"

      - name: Validate IPA before upload
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA" ]; then
            echo "No IPA found, skipping validation."
            exit 0
          fi
          echo "=== Validating IPA: $IPA ==="
          echo ""
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check
          APP_DIR=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_DIR"
          echo ""
          VALIDATION_FAILED=0

          echo "--- Xcode / SDK ---"
          XCODE_INFO=$(xcodebuild -version 2>/dev/null || true)
          ACTIVE_XCODE=$(printf '%s\n' "$XCODE_INFO" | head -1)
          echo "Builder: $ACTIVE_XCODE"
          SDK_NAME=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP_DIR/Info.plist" 2>/dev/null || true)
          echo "DTSDKName: ${SDK_NAME:-not found}"
          SDK_MAJOR=$(echo "${SDK_NAME:-iphoneos0}" | sed -E 's/iphoneos([0-9]+).*/\1/')
          if [ "${SDK_MAJOR:-0}" -ge 26 ] 2>/dev/null; then
            echo "SDK version: OK (${SDK_NAME} >= ios26)"
          else
            echo "::error::IPA built with '${SDK_NAME:-unknown}'. App Store Connect requires iOS 26 SDK. Rebuild with Xcode 26."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- Bundle versions ---"
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_DIR/Info.plist" 2>/dev/null || true)
          APP_MARKETING=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_DIR/Info.plist" 2>/dev/null || true)
          echo "App CFBundleShortVersionString: ${APP_MARKETING:-not found}"
          echo "App CFBundleVersion: ${APP_BUILD:-not found}"
          if [ "$APP_MARKETING" = "$MARKETING_VERSION" ]; then
            echo "App marketing version: OK"
          else
            echo "::error::App CFBundleShortVersionString = '${APP_MARKETING:-missing}'. Expected '$MARKETING_VERSION'."
            VALIDATION_FAILED=1
          fi
          if [ "$APP_BUILD" = "$BUILD_NUMBER" ]; then
            echo "App build number: OK"
          else
            echo "::error::App CFBundleVersion = '${APP_BUILD:-missing}'. Expected '$BUILD_NUMBER'. TestFlight requires every upload to have a higher build number."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- CFBundleIconName ---"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_DIR/Info.plist" 2>/dev/null || true)
          echo "CFBundleIconName: ${ICON_NAME:-not found}"
          if [ "$ICON_NAME" = "AppIcon" ]; then
            echo "CFBundleIconName: OK"
          else
            echo "::error::CFBundleIconName = '${ICON_NAME:-missing}'. Expected 'AppIcon'. App Store Connect will reject this IPA."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- Icon asset catalog ---"
          echo "App bundle top-level contents:"
          ls -la "$APP_DIR/" 2>/dev/null | head -n 40 || true
          echo ""
          ASSETS_CAR=$(find "$APP_DIR" -name "Assets.car" 2>/dev/null | head -n 1 || true)
          echo "Assets.car location: ${ASSETS_CAR:-not found}"
          if [ -n "$ASSETS_CAR" ]; then
            echo "Icon asset catalog: OK"
          else
            echo "::error::Assets.car not found anywhere in bundle. Asset catalog was not compiled."
            VALIDATION_FAILED=1
          fi
          echo "Checking source app icons for alpha channels:"
          set +e
          python3 <<'PY'
          import json
          import pathlib
          import struct
          import sys

          iconset = pathlib.Path("SysPulse/Resources/Assets.xcassets/AppIcon.appiconset")
          contents = json.loads((iconset / "Contents.json").read_text())
          failed = False

          def png_has_alpha(path: pathlib.Path) -> bool:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise ValueError(f"{path} is not a PNG")
              index = 8
              transparent_chunk = False
              color_type = None
              while index + 8 <= len(data):
                  length = struct.unpack(">I", data[index:index + 4])[0]
                  chunk_type = data[index + 4:index + 8]
                  chunk_data = data[index + 8:index + 8 + length]
                  if chunk_type == b"IHDR":
                      color_type = chunk_data[9]
                  elif chunk_type == b"tRNS":
                      transparent_chunk = True
                  index += 12 + length
              return color_type in (4, 6) or transparent_chunk

          for image in contents.get("images", []):
              filename = image.get("filename")
              if not filename:
                  continue
              path = iconset / filename
              has_alpha = png_has_alpha(path)
              print(f"{filename}: {'alpha channel found' if has_alpha else 'opaque'}")
              failed = failed or has_alpha

          if failed:
              print("::error::One or more AppIcon PNG files contain alpha. App Store Connect rejects large app icons with alpha.")
              sys.exit(1)
          PY
          ICON_ALPHA_STATUS=$?
          set -e
          if [ "$ICON_ALPHA_STATUS" -ne 0 ]; then
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- UILaunchScreen (letterboxing check) ---"
          LAUNCH_SCREEN=$(/usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_DIR/Info.plist" 2>/dev/null || true)
          if [ -n "$LAUNCH_SCREEN" ]; then
            echo "UILaunchScreen: OK"
          else
            echo "::error::UILaunchScreen key missing from Info.plist — iOS will show black bars (letterboxing) on device."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- Widget NSExtensionPointIdentifier ---"
          WIDGET_PLUGIN=$(find "$APP_DIR/PlugIns" -maxdepth 1 -name "*.appex" 2>/dev/null | head -n 1 || true)
          if [ -n "$WIDGET_PLUGIN" ]; then
            echo "Widget plugin: $WIDGET_PLUGIN"
            WIDGET_DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$WIDGET_PLUGIN/Info.plist" 2>/dev/null || true)
            echo "CFBundleDisplayName: ${WIDGET_DISPLAY_NAME:-not found}"
            if [ -z "$WIDGET_DISPLAY_NAME" ]; then
              echo "::error::Widget extension is missing CFBundleDisplayName."
              VALIDATION_FAILED=1
            fi
            WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$WIDGET_PLUGIN/Info.plist" 2>/dev/null || true)
            echo "CFBundleVersion: ${WIDGET_BUILD:-not found}"
            if [ "$WIDGET_BUILD" = "$BUILD_NUMBER" ]; then
              echo "Widget build number: OK"
            else
              echo "::error::Widget CFBundleVersion = '${WIDGET_BUILD:-missing}'. Expected '$BUILD_NUMBER'."
              VALIDATION_FAILED=1
            fi
            WIDGET_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_PLUGIN/Info.plist" 2>/dev/null || true)
            echo "NSExtensionPointIdentifier: ${WIDGET_POINT:-not found}"
            if [ "$WIDGET_POINT" = "com.apple.widgetkit-extension" ]; then
              echo "Widget NSExtensionPointIdentifier: OK"
            else
              echo "::error::NSExtensionPointIdentifier = '${WIDGET_POINT:-missing}'. Expected 'com.apple.widgetkit-extension'."
              VALIDATION_FAILED=1
            fi
          else
            echo "No .appex found in PlugIns."
          fi
          echo ""

          rm -rf /tmp/ipa_check

          if [ "$VALIDATION_FAILED" -ne 0 ]; then
            echo "::error::Pre-upload validation FAILED. Fix all issues above before running altool."
            exit 1
          fi

          echo "=== All pre-upload checks passed. Running xcrun altool --validate-app ==="
          if [ -n "${APPSTORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APPSTORE_CONNECT_API_ISSUER_ID:-}" ] && [ -n "${ASC_KEY_PATH:-}" ]; then
            set +e
            xcrun altool --validate-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID" \
              2>&1 | tee build/logs/altool-validate.log
            ALTOOL_VALIDATE_STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$ALTOOL_VALIDATE_STATUS" -ne 0 ] || grep -qE "VALIDATION FAILED|UPLOAD FAILED|Validation failed|Failed to upload package" build/logs/altool-validate.log; then
              if grep -q "Upload limit reached" build/logs/altool-validate.log; then
                echo "::warning::App Store Connect upload limit reached. Signed IPA was built and archived; retry TestFlight upload after Apple's limit resets."
                echo "TESTFLIGHT_UPLOAD_LIMIT_REACHED=true" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "::error::altool validate-app failed."
              grep -E "ERROR:|VALIDATION FAILED|UPLOAD FAILED|Validation failed|Failed to upload package|Invalid |Missing " build/logs/altool-validate.log | tail -n 80 | while IFS= read -r line; do
                escaped=${line//'%'/'%25'}
                escaped=${escaped//$'\n'/'%0A'}
                escaped=${escaped//$'\r'/'%0D'}
                echo "::error::$escaped"
              done
              exit 1
            fi
          else
            echo "altool --validate-app skipped (ASC key not configured)."
          fi
          echo "Validation complete."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syspulse-ios-build
          path: |
            build/
            SysPulse.xcodeproj/
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ env.APPSTORE_CONNECT_API_KEY_ID != '' && env.APPSTORE_CONNECT_API_ISSUER_ID != '' && env.APPSTORE_CONNECT_API_KEY_BASE64 != '' }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ "${TESTFLIGHT_UPLOAD_LIMIT_REACHED:-}" = "true" ]; then
            echo "Skipping TestFlight upload because App Store Connect reported the daily upload limit during validation."
            exit 0
          fi
          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA" ]; then
            echo "No IPA found. Configure signing secrets before TestFlight upload."
            exit 0
          fi
          mkdir -p private_keys
          if [ -z "${ASC_KEY_PATH:-}" ]; then
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["APPSTORE_CONNECT_API_KEY_BASE64"]))' > "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
            ASC_KEY_PATH="$PWD/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          fi
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID" \
            2>&1 | tee build/logs/altool-upload.log
          ALTOOL_UPLOAD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ALTOOL_UPLOAD_STATUS" -ne 0 ] || grep -qE "VALIDATION FAILED|UPLOAD FAILED|Validation failed|Failed to upload package" build/logs/altool-upload.log; then
            if grep -q "Upload limit reached" build/logs/altool-upload.log; then
              echo "::warning::App Store Connect upload limit reached. Signed IPA was built and archived; retry TestFlight upload after Apple's limit resets."
              exit 0
            fi
            echo "::error::altool upload-app failed."
            grep -E "ERROR:|VALIDATION FAILED|UPLOAD FAILED|Validation failed|Failed to upload package|Invalid |Missing " build/logs/altool-upload.log | tail -n 100 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
            exit 1
          fi
          echo "TestFlight upload command completed without altool validation errors."
