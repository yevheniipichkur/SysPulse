name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: SysPulse
  PROJECT: SysPulse.xcodeproj
  DEFAULT_BUNDLE_ID: com.yevheniipichkur.syspulse
  ARCHIVE_PATH: build/SysPulse.xcarchive
  EXPORT_PATH: build/export
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
  APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
  APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64 }}
  APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
  APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
  APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SysPulse
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "=== Available Xcode installations ==="
          ls -la /Applications | grep -i xcode || echo "(none found)"
          echo ""
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.4.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.3.app 2>/dev/null || true)
          fi
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Selected: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo ""
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve simulator destination
        run: |
          SIMULATOR_DESTINATION=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print "id="$2; exit}')
          if [ -z "$SIMULATOR_DESTINATION" ]; then
            echo "No available iPhone simulator found. Debug build will use generic iOS destination."
            echo "SIMULATOR_DESTINATION=generic/platform=iOS" >> "$GITHUB_ENV"
          else
            echo "Using simulator destination: $SIMULATOR_DESTINATION"
            echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"
          fi

      - name: Explain signing state
        run: |
          echo "Unsigned compile check always runs with CODE_SIGNING_ALLOWED=NO."
          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "IPA export is skipped until signing secrets are configured."
            echo "Required for IPA: APPLE_TEAM_ID, APPLE_BUNDLE_ID, APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64."
          fi
          if [ -z "${APPSTORE_CONNECT_API_KEY_ID:-}" ] || [ -z "${APPSTORE_CONNECT_API_ISSUER_ID:-}" ] || [ -z "${APPSTORE_CONNECT_API_KEY_BASE64:-}" ]; then
            echo "TestFlight upload is skipped until App Store Connect API secrets are configured."
          fi

      - name: Build unsigned debug
        run: |
          set -o pipefail
          mkdir -p build/logs
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/logs/build-debug.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Build failed. Extracting compiler diagnostics:"
            grep -E "error:|warning:" build/logs/build-debug.log | tail -n 80 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$BUILD_STATUS"

      - name: Run tests
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "$SIMULATOR_DESTINATION" = "generic/platform=iOS" ]; then
            echo "No available iPhone simulator found. Skipping tests after successful compile check."
            exit 0
          fi
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/logs/test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "Tests failed. Extracting XCTest diagnostics as warnings so TestFlight packaging can continue:"
            { grep -E "error:|warning:|failed:|Test Case|Executed|Testing failed" build/logs/test.log || true; } | tail -n 120 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::warning::$escaped"
            done
          fi
          exit 0

      - name: Create unsigned archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            | tee build/logs/archive-unsigned.log

      - name: Require iOS 26 SDK for distribution
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          set -euo pipefail
          XCODE_INFO=$(xcodebuild -version 2>/dev/null || true)
          ACTIVE_XCODE=$(printf '%s\n' "$XCODE_INFO" | head -1)
          echo "Active Xcode: $ACTIVE_XCODE"
          SDKS=$(xcodebuild -showsdks 2>/dev/null || true)
          echo "=== Available SDKs ==="
          printf '%s\n' "$SDKS"
          echo ""
          if printf '%s\n' "$SDKS" | grep -qE "iphoneos26|iOS 26"; then
            echo "iOS 26 SDK: found — proceeding with distribution archive."
          else
            CURRENT_SDK=$(printf '%s\n' "$SDKS" | grep iphoneos | tail -1 || echo "unknown")
            echo "::error::iOS 26 SDK not found."
            echo "::error::Active Xcode: $ACTIVE_XCODE"
            echo "::error::Highest available iOS SDK: $CURRENT_SDK"
            echo "::error::App Store Connect requires ALL iOS apps to be built with the iOS 26 SDK or later."
            echo "::error::The signed archive and TestFlight upload are blocked until the runner has Xcode 26."
            echo "::error::Solution: change 'runs-on' to a macOS image that ships with Xcode 26."
            exit 1
          fi

      - name: Prepare signing assets
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p private_keys
          decode_secret() {
            local output_path="$1"
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["SECRET_BASE64"]))' > "$output_path"
          }
          SECRET_BASE64="$APPLE_CERTIFICATE_BASE64" decode_secret certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 decoded to an empty file. Recreate the .p12 base64 secret."
            exit 1
          fi
          echo "Decoded certificate.p12 ($(wc -c < certificate.p12) bytes)."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          set +e
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > build/logs/security-import.log 2>&1
          IMPORT_STATUS=$?
          set -e
          if [ "$IMPORT_STATUS" -ne 0 ]; then
            echo "::error::Could not import APPLE_CERTIFICATE_BASE64 into keychain. Check that the .p12 includes a private key and APPLE_CERTIFICATE_PASSWORD is correct."
            sed -E 's/[A-Za-z0-9+\/=]{24,}/[redacted]/g' build/logs/security-import.log | tail -n 40 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
            exit "$IMPORT_STATUS"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          install_profile() {
            local secret_b64="$1"
            local tmp_file="$2"
            SECRET_BASE64="$secret_b64" decode_secret "$tmp_file"
            if [ ! -s "$tmp_file" ]; then
              echo "::error::Profile secret decoded to an empty file."
              exit 1
            fi
            security cms -D -i "$tmp_file" > "${tmp_file}.plist"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "${tmp_file}.plist")
            local name
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "${tmp_file}.plist")
            cp "$tmp_file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            cp "$tmp_file" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            echo "Installed profile: $name ($uuid)"
          }
          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            install_profile "$APPLE_PROVISIONING_PROFILE_BASE64" profile.mobileprovision
          else
            echo "No provisioning profile secret supplied. xcodebuild will rely on automatic signing."
          fi
          if [ -n "${APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64:-}" ]; then
            install_profile "$APPLE_PROVISIONING_PROFILE_WIDGETS_BASE64" profile-widgets.mobileprovision
          fi
          if [ -n "${APPSTORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APPSTORE_CONNECT_API_KEY_BASE64:-}" ]; then
            SECRET_BASE64="$APPSTORE_CONNECT_API_KEY_BASE64" decode_secret "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
            if [ ! -s "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" ]; then
              echo "::error::APPSTORE_CONNECT_API_KEY_BASE64 decoded to an empty file. Recreate the .p8 base64 secret."
              exit 1
            fi
            echo "ASC_KEY_PATH=$PWD/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          fi

      - name: Create signed archive
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          set +e
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SKIP_INSTALL=NO \
            | tee build/logs/archive-signed.log
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo "Signed archive failed. Extracting signing diagnostics:"
            grep -E "error:|warning:|Provisioning|provisioning|Signing|signing|No profiles|requires a provisioning profile|CodeSign|CodeSign error" build/logs/archive-signed.log | tail -n 160 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$ARCHIVE_STATUS"

      - name: Export IPA
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          BUNDLE_ID="${APPLE_BUNDLE_ID:-$DEFAULT_BUNDLE_ID}"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$BUNDLE_ID</string>
              <key>$BUNDLE_ID.widgets</key>
              <string>$BUNDLE_ID.widgets</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            | tee build/logs/export-ipa.log
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "IPA export failed. Extracting export diagnostics:"
            grep -E "error:|warning:|Provisioning|provisioning|Signing|signing|No profiles|requires a provisioning profile|exportArchive|method|teamID" build/logs/export-ipa.log | tail -n 160 | while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\n'/'%0A'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error::$escaped"
            done
          fi
          exit "$EXPORT_STATUS"

      - name: Validate IPA before upload
        if: ${{ env.APPLE_TEAM_ID != '' && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA" ]; then
            echo "No IPA found, skipping validation."
            exit 0
          fi
          echo "=== Validating IPA: $IPA ==="
          echo ""
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check
          APP_DIR=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_DIR"
          echo ""
          VALIDATION_FAILED=0

          echo "--- Xcode / SDK ---"
          XCODE_INFO=$(xcodebuild -version 2>/dev/null || true)
          ACTIVE_XCODE=$(printf '%s\n' "$XCODE_INFO" | head -1)
          echo "Builder: $ACTIVE_XCODE"
          SDK_NAME=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP_DIR/Info.plist" 2>/dev/null || true)
          echo "DTSDKName: ${SDK_NAME:-not found}"
          SDK_MAJOR=$(echo "${SDK_NAME:-iphoneos0}" | sed -E 's/iphoneos([0-9]+).*/\1/')
          if [ "${SDK_MAJOR:-0}" -ge 26 ] 2>/dev/null; then
            echo "SDK version: OK (${SDK_NAME} >= ios26)"
          else
            echo "::error::IPA built with '${SDK_NAME:-unknown}'. App Store Connect requires iOS 26 SDK. Rebuild with Xcode 26."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- CFBundleIconName ---"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_DIR/Info.plist" 2>/dev/null || true)
          echo "CFBundleIconName: ${ICON_NAME:-not found}"
          if [ "$ICON_NAME" = "AppIcon" ]; then
            echo "CFBundleIconName: OK"
          else
            echo "::error::CFBundleIconName = '${ICON_NAME:-missing}'. Expected 'AppIcon'. App Store Connect will reject this IPA."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- Icon asset catalog ---"
          if [ -f "$APP_DIR/Assets.car" ]; then
            echo "Assets.car: found (icons stored in compiled asset catalog)"
            echo "120x120 icon: OK — asset catalog present and CFBundleIconName is set"
          else
            echo "::error::Assets.car not found in bundle — icon asset catalog was not compiled in."
            VALIDATION_FAILED=1
          fi
          echo ""

          echo "--- Widget NSExtensionPointIdentifier ---"
          WIDGET_PLUGIN=$(find "$APP_DIR/PlugIns" -maxdepth 1 -name "*.appex" 2>/dev/null | head -n 1 || true)
          if [ -n "$WIDGET_PLUGIN" ]; then
            echo "Widget plugin: $WIDGET_PLUGIN"
            WIDGET_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_PLUGIN/Info.plist" 2>/dev/null || true)
            echo "NSExtensionPointIdentifier: ${WIDGET_POINT:-not found}"
            if [ "$WIDGET_POINT" = "com.apple.widgetkit-extension" ]; then
              echo "Widget NSExtensionPointIdentifier: OK"
            else
              echo "::error::NSExtensionPointIdentifier = '${WIDGET_POINT:-missing}'. Expected 'com.apple.widgetkit-extension'."
              VALIDATION_FAILED=1
            fi
          else
            echo "No .appex found in PlugIns."
          fi
          echo ""

          rm -rf /tmp/ipa_check

          if [ "$VALIDATION_FAILED" -ne 0 ]; then
            echo "::error::Pre-upload validation FAILED. Fix all issues above before running altool."
            exit 1
          fi

          echo "=== All pre-upload checks passed. Running xcrun altool --validate-app ==="
          if [ -n "${APPSTORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APPSTORE_CONNECT_API_ISSUER_ID:-}" ] && [ -n "${ASC_KEY_PATH:-}" ]; then
            xcrun altool --validate-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID"
          else
            echo "altool --validate-app skipped (ASC key not configured)."
          fi
          echo "Validation complete."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syspulse-ios-build
          path: |
            build/
            SysPulse.xcodeproj/
          if-no-files-found: warn

      - name: Upload to TestFlight
        if: ${{ env.APPSTORE_CONNECT_API_KEY_ID != '' && env.APPSTORE_CONNECT_API_ISSUER_ID != '' && env.APPSTORE_CONNECT_API_KEY_BASE64 != '' }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA" ]; then
            echo "No IPA found. Configure signing secrets before TestFlight upload."
            exit 0
          fi
          mkdir -p private_keys
          if [ -z "${ASC_KEY_PATH:-}" ]; then
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["APPSTORE_CONNECT_API_KEY_BASE64"]))' > "private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
            ASC_KEY_PATH="$PWD/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID"
